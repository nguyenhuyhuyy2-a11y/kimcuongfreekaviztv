 <!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tặng Kim Cương Free</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b020a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Background 3D Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* App Wrapper */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: rgba(255, 182, 193, 0.05);
            backdrop-filter: blur(12px);
            border-left: 1px solid rgba(255, 105, 180, 0.2);
            border-right: 1px solid rgba(255, 105, 180, 0.2);
            box-shadow: 0 0 50px rgba(255, 20, 147, 0.2);
        }

        /* Top Header Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 20, 147, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid #ffb6c1;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 6px;
            border-radius: 8px;
            transition: transform 0.2s;
        }

        .menu-btn:active {
            transform: scale(0.9);
        }

        .menu-btn span {
            width: 26px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }

        .balance-badge {
            background: linear-gradient(135deg, #fff0f5, #ffe4e1);
            color: #d81b60;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.4);
            border: 1.5px solid #ff69b4;
        }

        .user-status {
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 12px;
            color: #ffe4e1;
        }

        /* Main Card */
        .main-content {
            padding: 24px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            width: 100%;
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.35);
            border: 2px solid #ffb6c1;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #ff1493, #ff69b4, #ff1493);
        }

        .card-title {
            color: #d81b60;
            font-size: 1.6rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(216, 27, 96, 0.15);
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            color: #4a4a4a;
            margin-bottom: 8px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #ffc0cb;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            background: #fff5f7;
            color: #333;
        }

        .form-input:focus, .form-select:focus {
            border-color: #ff1493;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255, 20, 147, 0.2);
        }

        .price-display {
            font-size: 1.8rem;
            font-weight: 900;
            color: #d81b60;
            margin: 16px 0;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #ff1493, #c2185b);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 20, 147, 0.4);
            transition: all 0.2s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .btn-submit:active {
            transform: translateY(2px);
            box-shadow: 0 3px 10px rgba(255, 20, 147, 0.4);
        }

        /* Drawer Side Navigation */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .drawer-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100%;
            background: #fff0f5;
            z-index: 201;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            color: #333;
        }

        .drawer.active {
            left: 0;
        }

        .drawer-header {
            background: linear-gradient(135deg, #ff1493, #d81b60);
            color: white;
            padding: 20px 16px;
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .drawer-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-item {
            background: white;
            border: 1.5px solid #ffc0cb;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            color: #d81b60;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .menu-item:hover, .menu-item:active {
            background: #ffe4e1;
            border-color: #ff1493;
        }

        /* Modal / Popup */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-body {
            background: white;
            color: #333;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 2px solid #ff69b4;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-body {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #d81b60;
            margin-bottom: 16px;
            text-align: center;
        }

        .btn-social {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .btn-google { background: #db4437; }
        .btn-facebook { background: #4267b2; }
        .btn-twitter { background: #000000; }

        .btn-close-modal {
            width: 100%;
            padding: 10px;
            background: #eee;
            border: none;
            border-radius: 10px;
            margin-top: 10px;
            font-weight: 700;
            color: #666;
            cursor: pointer;
        }

        /* OAuth Mock Screen */
        .oauth-loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff1493;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .admin-box {
            text-align: center;
            padding: 10px 0;
        }

        .admin-price {
            font-size: 1.6rem;
            font-weight: 900;
            color: #d81b60;
            margin: 10px 0;
        }

        .btn-zalo {
            background: #0088ff;
            color: white;
            text-decoration: none;
            display: block;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Canvas Background 3D -->
    <canvas id="bg-canvas"></canvas>

    <!-- App Wrapper -->
    <div class="app-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <button class="menu-btn" onclick="toggleDrawer(true)" aria-label="Open Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div id="userStateBadge" class="user-status">Chưa đăng nhập</div>
            <div class="balance-badge">
                💰 Số dư: 1.000B
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="card">
                <div class="card-title">Tặng Kim Cương Free</div>
                
                <div class="form-group">
                    <label class="form-label" for="userId">ID người chơi</label>
                    <input type="text" id="userId" class="form-input" placeholder="Nhập ID game...">
                </div>

                <div class="form-group">
                    <label class="form-label" for="kcPackage">Chọn gói KC</label>
                    <select id="kcPackage" class="form-select" onchange="updatePrice()">
                        <option value="113" data-price="20.000">113 KC</option>
                        <option value="283" data-price="50.000">283 KC</option>
                        <option value="566" data-price="100.000">566 KC</option>
                        <option value="1132" data-price="200.000">1132 KC</option>
                        <option value="2830" data-price="500.000">2830 KC</option>
                        <option value="5750" data-price="1.000.000">5750 KC</option>
                        <option value="11500" data-price="2.000.000">11500 KC</option>
                    </select>
                </div>

                <div class="price-display" id="priceTag">20.000 đ</div>

                <button class="btn-submit" onclick="claimKC()">Nhận</button>
            </div>
        </div>
    </div>

    <!-- Drawer Navigation -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer(false)"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <span>Danh Mục Menu</span>
            <button class="drawer-close" onclick="toggleDrawer(false)">&times;</button>
        </div>
        <div class="drawer-content">
            <div class="menu-item" onclick="openAuthFlow()">
                👤 <span id="authMenuText">1. Tạo / Đăng Nhập Tài Khoản</span>
            </div>
            <div class="menu-item" onclick="openAdminModal()">
                👑 <span>2. Trở Thành Admin</span>
            </div>
        </div>
    </div>

    <!-- Modal Containers -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-body" id="modalBody">
            <!-- Dynamic Content Injected via JS -->
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- THREE.JS 3D BACKGROUND ---
        let scene, camera, renderer, diamondGroup;

        function init3D() {
            const canvas = document.getElementById('bg-canvas');
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            diamondGroup = new THREE.Group();
            scene.add(diamondGroup);

            // Create Floating Pink Crystals/Particles
            const geometry = new THREE.OctahedronGeometry(0.6, 0);
            
            for (let i = 0; i < 45; i++) {
                const material = new THREE.MeshPhongMaterial({
                    color: i % 2 === 0 ? 0xff1493 : 0xffb6c1,
                    shininess: 100,
                    transparent: true,
                    opacity: 0.75,
                    wireframe: i % 3 === 0
                });

                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(
                    (Math.random() - 0.5) * 25,
                    (Math.random() - 0.5) * 35,
                    (Math.random() - 0.5) * 15
                );
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                
                const scale = Math.random() * 0.8 + 0.4;
                mesh.scale.set(scale, scale * 1.4, scale);
                
                mesh.userData = {
                    rotSpeedX: (Math.random() - 0.5) * 0.02,
                    rotSpeedY: (Math.random() - 0.5) * 0.02,
                    floatSpeed: Math.random() * 0.01 + 0.005
                };

                diamondGroup.add(mesh);
            }

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0xff1493, 2, 50);
            pointLight1.position.set(10, 10, 10);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xff69b4, 1.5, 50);
            pointLight2.position.set(-10, -10, 10);
            scene.add(pointLight2);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            diamondGroup.children.forEach(child => {
                child.rotation.x += child.userData.rotSpeedX;
                child.rotation.y += child.userData.rotSpeedY;
                child.position.y += Math.sin(Date.now() * 0.001 + child.position.x) * child.userData.floatSpeed;
            });

            diamondGroup.rotation.y += 0.002;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- APP LOGIC ---
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;

        function updatePrice() {
            const select = document.getElementById('kcPackage');
            const selectedOption = select.options[select.selectedIndex];
            document.getElementById('priceTag').innerText = selectedOption.getAttribute('data-price') + ' đ';
        }

        function toggleDrawer(open) {
            document.getElementById('drawer').classList.toggle('active', open);
            document.getElementById('drawerOverlay').classList.toggle('active', open);
        }

        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function checkAuthState() {
            const badge = document.getElementById('userStateBadge');
            const menuText = document.getElementById('authMenuText');
            if (currentUser) {
                badge.innerText = '👤 ' + currentUser.username;
                badge.style.color = '#76ff03';
                menuText.innerText = '1. Đăng Xuất Tài Khoản (' + currentUser.username + ')';
            } else {
                badge.innerText = 'Chưa đăng nhập';
                badge.style.color = '#ffe4e1';
                menuText.innerText = '1. Tạo / Đăng Nhập Tài Khoản';
            }
        }

        function claimKC() {
            const id = document.getElementById('userId').value.trim();
            const kc = document.getElementById('kcPackage').value;

            if (!id) {
                showAlert('Lỗi', 'Vui lòng nhập ID người chơi!');
                return;
            }

            if (!currentUser) {
                showAlert('Yêu Cầu Đăng Nhập', 'Bạn phải Đăng Ký/Đăng Nhập tài khoản trước khi nhận Kim Cương!', () => {
                    openAuthFlow();
                });
                return;
            }

            showAlert('Chúc Mừng!', `Chúc Mừng ID ${id} Đã Nhận Được ${kc} KC`);
        }

        function showAlert(title, msg, onClose) {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="modal-title">${title}</div>
                <p style="text-align: center; margin: 15px 0; font-size: 1.05rem; line-height: 1.5; color: #444;">${msg}</p>
                <button class="btn-submit" id="alertOkBtn">Đóng</button>
            `;
            openModal();
            document.getElementById('alertOkBtn').onclick = () => {
                closeModal();
                if (onClose) onClose();
            };
        }

        // --- AUTH & SOCIAL FLOW ---
        function openAuthFlow() {
            toggleDrawer(false);
            if (currentUser) {
                showAlert('Xác Nhận', 'Bạn có muốn đăng xuất khỏi tài khoản?', () => {
                    currentUser = null;
                    localStorage.removeItem('currentUser');
                    checkAuthState();
                    showAlert('Thành Công', 'Đã đăng xuất tài khoản!');
                });
                return;
            }

            showAuthMethodSelect();
        }

        function showAuthMethodSelect() {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="modal-title">Tạo / Đăng Nhập Tài Khoản</div>
                <p style="text-align: center; font-size: 0.85rem; color: #666; margin-bottom: 15px;">Chọn phương thức tạo tài khoản xã hội:</p>
                
                <button class="btn-social btn-google" onclick="startSocialLogin('Google')">
                    🌐 Đăng ký bằng Google
                </button>
                <button class="btn-social btn-facebook" onclick="startSocialLogin('Facebook')">
                    📘 Đăng ký bằng Facebook
                </button>
                <button class="btn-social btn-twitter" onclick="startSocialLogin('X (Twitter)')">
                    🐦 Đăng ký bằng Twitter / X
                </button>

                <div style="text-align: center; margin: 15px 0; font-size: 0.85rem; color: #888;">--- Đã có tài khoản? ---</div>
                
                <button class="btn-submit" style="background: #2e7d32;" onclick="showLoginForm()">Đăng Nhập Ngay</button>
                <button class="btn-close-modal" onclick="closeModal()">Đóng</button>
            `;
            openModal();
        }

        function startSocialLogin(platform) {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="oauth-loading">
                    <div class="modal-title">Đang kết nối ${platform}...</div>
                    <div class="spinner"></div>
                    <p style="font-size: 0.85rem; color: #666;">Đang chuyển hướng đến trang xác thực bảo mật...</p>
                </div>
            `;
            
            setTimeout(() => {
                showRegisterForm(platform);
            }, 1800);
        }

        function showRegisterForm(platform = '') {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="modal-title">Đăng Kí Tài Khoản ${platform ? '(' + platform + ')' : ''}</div>
                
                <div class="form-group">
                    <label class="form-label">Tên:</label>
                    <input type="text" id="regFullName" class="form-input" placeholder="Nhập họ và tên...">
                </div>

                <div class="form-group">
                    <label class="form-label">Tên Đăng Nhập:</label>
                    <input type="text" id="regUser" class="form-input" placeholder="Nhập tên đăng nhập...">
                </div>

                <div class="form-group">
                    <label class="form-label">Gmail:</label>
                    <input type="email" id="regEmail" class="form-input" placeholder="example@gmail.com">
                </div>

                <div class="form-group">
                    <label class="form-label">SDT:</label>
                    <input type="tel" id="regPhone" class="form-input" placeholder="Nhập số điện thoại...">
                </div>

                <div class="form-group">
                    <label class="form-label">MK (Mật khẩu):</label>
                    <input type="password" id="regPass" class="form-input" placeholder="Nhập mật khẩu...">
                </div>

                <button class="btn-submit" onclick="processRegister()">Ấn Vào Đây Để Đăng Kí Tài Khoản</button>
                <button class="btn-close-modal" onclick="showAuthMethodSelect()">Quay lại</button>
            `;
        }

        function processRegister() {
            const name = document.getElementById('regFullName').value.trim();
            const user = document.getElementById('regUser').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const pass = document.getElementById('regPass').value.trim();

            if (!name || !user || !email || !phone || !pass) {
                alert('Vui lòng điền đầy đủ tất cả thông tin!');
                return;
            }

            let accounts = JSON.parse(localStorage.getItem('registeredAccounts')) || [];
            
            if (accounts.some(acc => acc.username === user)) {
                alert('Tên đăng nhập này đã tồn tại! Vui lòng chọn tên khác.');
                return;
            }

            const newAcc = { fullName: name, username: user, email: email, phone: phone, pass: pass };
            accounts.push(newAcc);
            localStorage.setItem('registeredAccounts', JSON.stringify(accounts));

            alert('Đăng ký tài khoản thành công! Hãy đăng nhập để tiếp tục.');
            showLoginForm(user);
        }

        function showLoginForm(defaultUser = '') {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="modal-title">Đăng Nhập Tài Khoản</div>

                <div class="form-group">
                    <label class="form-label">ID / Tên Đăng Nhập:</label>
                    <input type="text" id="loginUser" class="form-input" value="${defaultUser}" placeholder="Nhập tên đăng nhập...">
                </div>

                <div class="form-group">
                    <label class="form-label">Mật khẩu:</label>
                    <input type="password" id="loginPass" class="form-input" placeholder="Nhập mật khẩu...">
                </div>

                <button class="btn-submit" onclick="processLogin()">Đăng Nhập</button>
                <button class="btn-close-modal" onclick="showAuthMethodSelect()">Quay lại</button>
            `;
            openModal();
        }

        function processLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            if (!user || !pass) {
                alert('Vui lòng nhập đầy đủ ID/Tên đăng nhập và Mật khẩu!');
                return;
            }

            let accounts = JSON.parse(localStorage.getItem('registeredAccounts')) || [];
            const foundAcc = accounts.find(acc => acc.username === user && acc.pass === pass);

            if (foundAcc) {
                currentUser = foundAcc;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                checkAuthState();
                closeModal();
                showAlert('Thành Công', 'Đăng nhập thành công! Chúc bạn nhận kim cương vui vẻ.');
            } else {
                alert('Tài khoản hoặc mật khẩu không chính xác! Không thể đăng nhập.');
            }
        }

        function openAdminModal() {
            toggleDrawer(false);
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="modal-title">Trở Thành Admin</div>
                <div class="admin-box">
                    <p style="font-size: 0.95rem; color: #555;">Chi phí nâng cấp tài khoản Admin hệ thống:</p>
                    <div class="admin-price">190.000 đ</div>
                    <p style="font-size: 0.85rem; color: #666;">Liên hệ trực tiếp Zalo để hoàn tất nâng cấp:</p>
                    <p style="font-weight: 800; font-size: 1.2rem; color: #333; margin-top: 5px;">📞 0975787858</p>
                    
                    <a href="https://zalo.me/0975787858" target="_blank" class="btn-zalo">💬 Liên Hệ Zalo Ngay</a>
                </div>
                <button class="btn-close-modal" onclick="closeModal()">Đóng</button>
            `;
            openModal();
        }

        // Init on load
        window.onload = () => {
            init3D();
            checkAuthState();
        };
    </script>
</body>
</html>
